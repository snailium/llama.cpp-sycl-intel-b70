这张SVG信息图完整展示了**宇宙大爆炸理论**的核心内容，包含以下几个部分：

### 📐 主图区域（上半部分）
用5个阶段从左到右展示宇宙演化过程：
1. **奇点 (t=0)** — 所有物质能量集中于一点，温度约10³² K
2. **原初核合成 (~3分钟)** — 形成氢、氦等轻元素
3. **复合时期 (~38万年)** — 原子形成，光子自由传播产生CMB辐射
4. **星系形成 (~数亿年)** — 引力聚集物质形成恒星和星系
5. **现代宇宙 (~138亿年)** — 持续膨胀，暗能量主导

每个阶段配有时间轴标注和箭头指示演化方向。

