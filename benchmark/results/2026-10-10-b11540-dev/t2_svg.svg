<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <defs>
    <!-- 深空背景渐变 -->
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#000008"/>
    </radialGradient>
    
    <!-- 大爆炸核心光晕 -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#ffffcc"/>
      <stop offset="40%" stop-color="#ffaa33"/>
      <stop offset="60%" stop-color="#ff4400"/>
      <stop offset="80%" stop-color="#cc1100"/>
      <stop offset="100%" stop-color="#660000" stop-opacity="0"/>
    </radialGradient>
    
    <!-- 膨胀环渐变 -->
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#ff6600" stop-opacity="0"/>
      <stop offset="85%" stop-color="#ff9944" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffcc88" stop-opacity="0"/>
    </radialGradient>
    
    <!-- 星系渐变 -->
    <radialGradient id="galaxyGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#aaccff"/>
      <stop offset="60%" stop-color="#4488cc"/>
      <stop offset="100%" stop-color="#2244aa" stop-opacity="0"/>
    </radialGradient>
    
    <!-- 星系团渐变 -->
    <radialGradient id="clusterGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#88bbff"/>
      <stop offset="100%" stop-color="#3366aa" stop-opacity="0"/>
    </radialGradient>
    
    <!-- 时间轴箭头 -->
    <marker id="arrowEnd" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#66ccff"/>
    </marker>
    
    <!-- 滤镜：发光效果 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 文字背景 -->
    <linearGradient id="textBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a2e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1a1a4e" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  
