**上半部分 — 五大演化阶段（从左到右）：**
1. **① 奇点 (t=0)** — 无限密度与温度的时空起点
2. **② 暴胀期 (~10⁻³⁶s)** — 空间指数级极速膨胀，量子涨落被放大
3. **③ 原初核合成 (1秒~20分钟)** — 形成氢(75%)和氦(25%)等离子体
4. **④ 复合时代 (~38万年)** — 电子与质子结合成原子，宇宙变透明，释放CMB
5. **⑤ 结构形成 (数亿年)** — 引力聚集物质，形成恒星、星系和大尺度结构

**中间 — 时间轴：** 标注各关键时间节点（奇点→暴胀→核合成→复合→星系形成→现在138亿年）

