    <text x="620" y="35" text-anchor="middle" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="10" fill="#8899aa">核合成</text>
    
    <!-- 复合 -->
    <line x1="860" y1="-15" x2="860" y2="20" stroke="#44aaff" stroke-width="3"/>
    <circle cx="860" cy="3" r="6" fill="#44aaff" filter="url(#glow)"/>
    <text x="860" y="-25" text-anchor="middle" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" fill="#88ccff" font-weight="bold">38万 yr</text>
    <text x="860" y="35" text-anchor="middle" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="10" fill="#8899aa">复合/CMB</text>
    
    <!-- 结构形成 -->
    <line x1="1080" y1="-15" x2="1080" y2="20" stroke="#66ccaa" stroke-width="3"/>
