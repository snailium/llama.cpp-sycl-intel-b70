    </text>
    <text x="0" y="-75" text-anchor="middle" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="11" fill="#aabbcc">
      ~10⁻³⁶ 秒
    </text>
    
    <!-- 说明文字 -->
    <text x="0" y="50" text-anchor="middle" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="10" fill="#8899aa">
      指数级膨胀
    </text>
    <text x="0" y="65" text-anchor="middle" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="10" fill="#8899aa">
      空间极速扩张
    </text>
    <text x="0" y="80" text-anchor="middle" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="10" fill="#8899aa">
      量子涨落放大
    </text>
    
    <!-- 箭头 -->
    <path d="M 95,0 L 120,0" stroke="#ff6644" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  </g>

  <!-- ====== 阶段3: 原初核合成 (1秒 ~ 20分钟) ====== -->
  <g transform="translate(620, 280)">
    <rect x="-90" y="-120" width="180" height="240" rx="10" ry="10" fill="#0a0a2e" stroke="#334466" stroke-width="1" opacity="0.5"/>
    
    <!-- 等离子体示意 -->
    <circle cx="0" cy="0" r="55" fill="url(#cmbGrad)" opacity="0.3"/>
    
    <!-- 原子核示意 -->
