    <circle cx="550" cy="140" r="1" fill="#ffffff"/>
    <circle cx="750" cy="170" r="1.3" fill="#ffffff"/>
    <circle cx="950" cy="150" r="0.9" fill="#ffffff"/>
    <circle cx="1150" cy="180" r="1.2" fill="#ffffff"/>
    <circle cx="150" cy="750" r="1.3" fill="#ffffff"/>
    <circle cx="350" cy="780" r="1" fill="#ffffff"/>
    <circle cx="550" cy="760" r="1.5" fill="#ffffff"/>
    <circle cx="750" cy="790" r="0.8" fill="#ffffff"/>
    <circle cx="950" cy="770" r="1.2" fill="#ffffff"/>
    <circle cx="1100" cy="800" r="1" fill="#ffffff"/>
  </g>

  <!-- 标题 -->
  <text x="600" y="55" text-anchor="middle" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="32" fill="#ffffff" font-weight="bold" filter="url(#glow)">
    宇宙大爆炸理论
  </text>
  <text x="600" y="85" text-anchor="middle" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="16" fill="#aabbcc">
    The Big Bang Theory — 宇宙起源与演化
  </text>

  <!-- ====== 阶段1: 奇点 (t=0) ====== -->
  <g transform="translate(150, 280)">
    <!-- 背景框 -->
    <rect x="-80" y="-120" width="160" height="240" rx="10" ry="10" fill="#0a0a2e" stroke="#334466" stroke-width="1" opacity="0.5"/>
    
    <!-- 奇点核心 -->
    <circle cx="0" cy="0" r="8" fill="#ffffff" filter="url(#bigGlow)"/>
    <circle cx="0" cy="0" r="4" fill="#ffffcc"/>
    
    <!-- 辐射线 -->
    <g stroke="#ffaa33" stroke-width="1.5" opacity="0.6">
      <line x1="8" y1="0" x2="25" y2="0"/>
      <line x1="-8" y1="0" x2="-25" y2="0"/>
      <line x1="0" y1="8" x2="0" y2="25"/>
      <line x1="0" y1="-8" x2="0" y2="-25"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
      <line x1="-6" y1="6" x2="-18" y2="18"/>
      <line x1="6" y1="-6" x2="18" y2="-18"/>
      <line x1="-6" y1="-6" x2="-18" y2="-18"/>
    </g>
    
    <!-- 标签 -->
    <text x="0" y="-95" text-anchor="middle" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="14" fill="#ffcc66" font-weight="bold">
      ① 奇点
    </text>
    <text x="0" y="-75" text-anchor="middle" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="11" fill="#aabbcc">
      t = 0
    </text>
    
    <!-- 说明文字 -->
    <text x="0" y="45" text-anchor="middle" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="10" fill="#8899aa">
      无限密度
    </text>
    <text x="0" y="60" text-anchor="middle" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="10" fill="#8899aa">
      无限温度
    </text>
    <text x="0" y="75" text-anchor="middle" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="10" fill="#8899aa">
      时空起点
    </text>
    
    <!-- 箭头指向下一阶段 -->
    <path d="M 85,0 L 110,0" stroke="#ff6644" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  </g>

  <!-- 定义箭头标记 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff6644"/>
    </marker>
    <marker id="arrowheadBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#44aaff"/>
    </marker>
  </defs>

  <!-- ====== 阶段2: 暴胀 (10^-36 s ~ 10^-32 s) ====== -->
  <g transform="translate(380, 280)">
    <rect x="-90" y="-120" width="180" height="240" rx="10" ry="10" fill="#0a0a2e" stroke="#334466" stroke-width="1" opacity="0.5"/>
    
    <!-- 暴胀示意：快速膨胀的波纹 -->
    <circle cx="0" cy="0" r="15" fill="none" stroke="#ff8844" stroke-width="2" opacity="0.8"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#ff6622" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#ff4400" stroke-width="1" opacity="0.4"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#cc3300" stroke-width="0.8" opacity="0.3"/>
    
    <!-- 中心亮核 -->
    <circle cx="0" cy="0" r="10" fill="url(#explosionCenter)" filter="url(#bigGlow)"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
    
    <!-- 向外箭头表示膨胀 -->
    <g stroke="#ffaa66" stroke-width="2" fill="none" opacity="0.7">
      <line x1="15" y1="0" x2="35" y2="0" marker-end="url(#arrowhead)"/>
      <line x1="-15" y1="0" x2="-35" y2="0" marker-end="url(#arrowhead)"/>
      <line x1="0" y1="15" x2="0" y2="35" marker-end="url(#arrowhead)"/>
      <line x1="0" y1="-15" x2="0" y2="-35" marker-end="url(#arrowhead)"/>
    </g>
    
    <!-- 标签 -->
    <text x="0" y="-95" text-anchor="middle" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="14" fill="#ffaa66" font-weight="bold">
