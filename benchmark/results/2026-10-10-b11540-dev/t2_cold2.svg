  <!-- ====== 阶段5: 结构形成 (数亿年) ====== -->
  <g transform="translate(1080, 280)">
    <rect x="-90" y="-120" width="180" height="240" rx="10" ry="10" fill="#0a0a2e" stroke="#334466" stroke-width="1" opacity="0.5"/>
    
    <!-- 星系团示意 -->
    <!-- 中心大星系 -->
    <ellipse cx="0" cy="-10" rx="25" ry="8" fill="url(#galaxyGrad)" transform="rotate(-30, 0, -10)"/>
