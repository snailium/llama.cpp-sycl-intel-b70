```svg
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <!-- 渐变定义 -->
    <radialGradient id="explosionCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="20%" style="stop-color:#ffff99;stop-opacity:0.9"/>
      <stop offset="40%" style="stop-color:#ffcc33;stop-opacity:0.7"/>
      <stop offset="60%" style="stop-color:#ff6600;stop-opacity:0.5"/>
      <stop offset="80%" style="stop-color:#cc3300;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#661100;stop-opacity:0"/>
    </radialGradient>
    
    <radialGradient id="spaceBackground" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#0a0a2e;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#0d0d3d;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#050515;stop-opacity:1"/>
    </radialGradient>
    
    <linearGradient id="timelineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:1"/>
      <stop offset="30%" style="stop-color:#ff8800;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#ffcc00;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#44aaff;stop-opacity:1"/>
    </linearGradient>
    
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <linearGradient id="cmbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6644;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#ffaa66;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#ffcc88;stop-opacity:0.4"/>
    </linearGradient>
    
    <radialGradient id="galaxyGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="30%" style="stop-color:#aaddff;stop-opacity:0.8"/>
      <stop offset="60%" style="stop-color:#6699cc;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#334466;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="900" fill="url(#spaceBackground)"/>
  
  <!-- 星星背景 -->
  <g opacity="0.6">
    <circle cx="50" cy="30" r="1.5" fill="#ffffff"/>
    <circle cx="120" cy="80" r="1" fill="#ffffff"/>
    <circle cx="200" cy="40" r="1.2" fill="#ffffff"/>
    <circle cx="300" cy="70" r="0.8" fill="#ffffff"/>
    <circle cx="400" cy="25" r="1.5" fill="#ffffff"/>
    <circle cx="500" cy="60" r="1" fill="#ffffff"/>
    <circle cx="600" cy="35" r="1.3" fill="#ffffff"/>
    <circle cx="700" cy="80" r="0.9" fill="#ffffff"/>
    <circle cx="800" cy="45" r="1.4" fill="#ffffff"/>
    <circle cx="900" cy="20" r="1.1" fill="#ffffff"/>
    <circle cx="1000" cy="70" r="1.6" fill="#ffffff"/>
    <circle cx="1100" cy="40" r="1" fill="#ffffff"/>
    <circle cx="80" cy="150" r="1.2" fill="#ffffff"/>
