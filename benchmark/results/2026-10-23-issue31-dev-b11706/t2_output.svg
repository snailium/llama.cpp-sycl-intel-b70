```

这张 SVG 信息图以**时间轴**为主线，分六个阶段直观展示宇宙大爆炸理论：

| 阶段 | 时间 | 核心内容 |
|------|------|----------|
| **奇点** | t = 0 | 时空起点，无限密度与温度 |
| **宇宙暴胀** | ~10⁻³⁶ s | 指数级极速膨胀（10²⁶倍） |
| **基本粒子形成** | ~10⁻¹² s | 夸克-胶子等离子体，四种力分离 |
| **原初核合成** | ~3 分钟 | 氢、氦等轻元素形成（比例约3:1） |
| **CMB 辐射** | ~38 万年 | 宇宙首次透明，光子自由传播 |
| **星系与恒星** | 数亿年→今天 | 引力聚集，恒星点燃，持续膨胀至今 |

图中还包含：
- 🎨 各阶段用不同颜色区分（红→橙→黄→绿→蓝→紫）
- ⏳ 底部彩色渐变时间轴
- ✅ 右侧列出四大关键观测证据
- ✨ 动态动画效果（奇点脉动、膨胀波纹、CMB扩散）