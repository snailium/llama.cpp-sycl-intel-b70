name: Build Stable (main)

on:
  schedule:
    # Every 4 hours: check compute-runtime (and llama.cpp) for updates
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a stable build even if this version combo already exists in GHCR'
        required: false
        default: 'false'
        type: boolean

jobs:
  check-and-build-stable:
    # Only run on main branch (schedule or manual)
    if: |
      github.ref_name == 'main' ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      # contents: write is required because the stable build AUTO-ADVANCES the
      # vendored subtree: after a successful build it commits the synced tree
      # back to main so the repository keeps recording the exact source that
      # was built. Pushes made with GITHUB_TOKEN do not start new workflow runs,
      # so this cannot loop.
      contents: write
      packages: write
      issues: write

    steps:
      - name: Checkout repository (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ============================================================
      # Resolve the newest upstream llama.cpp RELEASE tag.
      #
      # The stable build AUTO-ADVANCES, mirroring the dev workflow. It
      # resolves the newest v* tag from upstream and syncs the vendored
      # subtree to it before building, so a released llama.cpp version enters
      # the stable image on the next scheduled run with no manual step.
      #
      # This replaces the earlier behaviour of reading the version ONLY from
      # the committed subtree and never consulting upstream. That made every
      # advance a manual act, so once the subtree sat at v0.6.0 the 4-hourly
      # cron computed the SAME prefix, found `server-c<CR>-v0.6.0` already in
      # GHCR, and skipped - forever, while reporting green in ~15s. v0.7.0 was
      # released upstream on 2026-10-15 and never built. The image tag is still
      # derived from the committed tree, so what is built remains traceable to
      # a commit; only the decision to advance is now automatic.
      # ============================================================
      - name: Resolve newest upstream llama.cpp release tag
        id: upstream
        run: |
          set -e
          UP="$RUNNER_TEMP/llama-upstream"
          rm -rf "$UP"
          # Partial clone: we only need tags here. The subtree sync reads the
          # same clone afterwards, so upstream is fetched once per run.
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/ggml-org/llama.cpp.git "$UP"
          git -C "$UP" fetch --quiet --tags --force origin "+refs/tags/*:refs/tags/*"

          # --sort=-creatordate puts the newest tag first, so the first exact
          # match is the newest release. The scan is a pure-bash loop on
          # purpose: any pipeline whose reader stops early (`| grep -m1`,
          # `| head -1`) SIGPIPEs its writer and spams "Broken pipe" into the
          # log on every run.
          #
          # A fnmatch glob such as refs/tags/v[0-9]* cannot replace the regex:
          # it would also match pre-release tags like v0.7.0-rc1.
          TAGS=$(git -C "$UP" for-each-ref --sort=-creatordate --format '%(refname:short)' refs/tags)
          LATEST_V=""
          while IFS= read -r t; do
            if [ -z "$LATEST_V" ] && [[ "$t" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then LATEST_V="$t"; fi
          done <<< "$TAGS"
          [ -n "$LATEST_V" ] || { echo "::error::upstream has no v* release tag"; exit 1; }

          echo "upstream_dir=$UP" >> $GITHUB_OUTPUT
          echo "upstream_v=$LATEST_V" >> $GITHUB_OUTPUT
          echo "Upstream newest release: $LATEST_V"

      - name: Detect latest compute-runtime and derive paired Intel stack
        id: deps
        run: |
          set -e
          CRREL=$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/intel/compute-runtime/releases/latest)
          CR=$(echo "$CRREL" | jq -r '.tag_name')

          # Paired versions from the release notes (authoritative pairing)
          BODY=$(echo "$CRREL" | jq -r '.body')
          IGC=$(echo "$BODY" | grep -oE 'intel-graphics-compiler@v[0-9]+(\.[0-9]+)+' | head -1 | cut -d@ -f2)
          L0=$(echo "$BODY"  | grep -oE 'level-zero@v[0-9]+(\.[0-9]+)+' | head -1 | cut -d@ -f2)
          GMM=$(echo "$BODY" | grep -oE 'intel-gmmlib-[0-9]+(\.[0-9]+)+' | head -1 | sed -E 's/.*-([0-9.]+)/\1/')

          # Fail loudly if any paired version failed to extract (release-notes
          # formatting drift would otherwise silently produce empty pins).
          [ -z "$IGC" ] && { echo "ERR: failed to extract IGC from compute-runtime $CR release notes" >&2; exit 1; }
          [ -z "$L0" ]  && { echo "ERR: failed to extract level-zero from compute-runtime $CR release notes" >&2; exit 1; }
          [ -z "$GMM" ] && { echo "ERR: failed to extract gmmlib from compute-runtime $CR release notes" >&2; exit 1; }

          # compute-runtime FULL version from the ocloc asset name
          CRF=$(echo "$CRREL" | jq -r '.assets[] | select((.name|contains("ocloc_")) and (.name|endswith(".deb"))) | .name' | head -1 | sed -E 's/.*ocloc_([0-9.-]+)_amd64.*/\1/')
          [ -z "$CRF" ] && CRF="${CR}-0"

          # IGC FULL version from IGC release assets
          IGREL=$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/intel/intel-graphics-compiler/releases/tags/$IGC")
          IGCF=$(echo "$IGREL" | jq -r '.assets[] | select((.name|contains("igc-core-")) and (.name|endswith(".deb")) and ((.name|contains("devel"))|not)) | .name' | head -1 | sed -E 's/.*igc-core-([0-9_+.]+)_amd64.*/\1/')

          # level-zero ubuntu suffix from assets
          LZREL=$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/oneapi-src/level-zero/releases/tags/$L0")
          LZS=$(echo "$LZREL" | jq -r '.assets[].name' | grep -oE 'u[0-9]+\.[0-9]+' | sort -Vu)
          # Derive the L0 ubuntu suffix from the base ONEAPI image tag (NOT a
          # hardcoded u24). Prefer an exact match to the base distro; if that
          # build isn't shipped, fall back to the highest suffix present so we
          # never silently pick a different Ubuntu release.
          OBASE=$(grep '^ARG ONEAPI_VERSION=' .devops/intel.Dockerfile | head -1 | cut -d= -f2 | grep -oE 'ubuntu[0-9]+\.[0-9]+' | head -1 | sed -E 's/ubuntu/u/')
          [ -z "$OBASE" ] && OBASE="u24.04"
          LZU=$(echo "$LZS" | grep -F "$OBASE" | head -1)
          [ -z "$LZU" ] && LZU=$(echo "$LZS" | tail -1)
          [ -z "$LZU" ] && LZU="u24.04"
          echo "  base distro $OBASE -> level-zero ubuntu suffix $LZU"

          echo "latest_compute=$CR" >> $GITHUB_OUTPUT
          echo "latest_compute_full=$CRF" >> $GITHUB_OUTPUT
          echo "latest_igc=$IGC" >> $GITHUB_OUTPUT
          echo "latest_igc_full=$IGCF" >> $GITHUB_OUTPUT
          echo "latest_level_zero=${L0#v}" >> $GITHUB_OUTPUT
          echo "level_zero_ubuntu_version=$LZU" >> $GITHUB_OUTPUT
          echo "latest_igdgmm=$GMM" >> $GITHUB_OUTPUT

          echo "Derived Intel stack from compute-runtime $CR:"
          echo "  IGC=$IGC ($IGCF)   L0=${L0#v} ($LZU)   gmmlib=$GMM   CR_FULL=$CRF"

      # ============================================================
      # Decide: skip if this exact version combo is already built.
      # The image tag embeds the version fingerprint
      # (server-c<CR>-<llama>-), so check GHCR for a tag with that
      # prefix. If it exists we already built this combo -> do NOT
      # rebuild (previously it rebuilt identical images every 4h
      # because the vendored llama.cpp subtree is never refreshed,
      # so the old "subtree older than tag" heuristic always fired).
      # A new compute-runtime or llama.cpp tag changes the prefix,
      # so this check auto-covers version updates too.
      # ============================================================
      - name: Decide if build is needed (skip if this combo already built)
        id: decide
        run: |
          set -e
          # The version the SUBTREE currently carries, which is what the tree
          # would build as-is. Compared with upstream's newest release below:
          # when they differ the subtree is stale and must advance first.
          CURRENT_V=$(grep -m1 '^tag=' llama.cpp/.subtree-upstream | cut -d= -f2)
          UPSTREAM_V="${{ steps.upstream.outputs.upstream_v }}"
          [ -n "$UPSTREAM_V" ] || { echo "::error::no upstream release tag resolved"; exit 1; }

          echo "current_v=$CURRENT_V" >> $GITHUB_OUTPUT
          if [[ "$UPSTREAM_V" != "$CURRENT_V" ]]; then
            echo "should_advance=true" >> $GITHUB_OUTPUT
          else
            echo "should_advance=false" >> $GITHUB_OUTPUT
          fi

          REPO="${{ github.repository }}/llama-sycl-b70"
          # The prefix names the version we are going to BUILD, which after the
          # advance is upstream's newest release rather than the stale subtree.
          PREFIX="server-c${{ steps.deps.outputs.latest_compute }}-${UPSTREAM_V}-"
          SHOULD_BUILD=false
          REASON=""
          FORCE="${{ github.event.inputs.force || 'false' }}"

          TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:${REPO}:pull" | jq -r .token)
          TAGS=$(curl -s -H "Authorization: Bearer $TOKEN" "https://ghcr.io/v2/${REPO}/tags/list" | jq -r '.tags[]? // empty' || true)

          if [ -z "$TOKEN" ]; then
            # registry check inconclusive -> fail closed to avoid a duplicate build
            REASON="GHCR auth failed - skipped (will re-check next run)"
          elif [[ "$TAGS" == *"$PREFIX"* ]]; then
            REASON="Already built ${PREFIX%?} in GHCR - skipping redundant rebuild"
          else
            SHOULD_BUILD=true
            CR_CUR=$(grep '^ARG COMPUTE_RUNTIME_VERSION=' .devops/intel.Dockerfile | head -1 | cut -d= -f2)
            if [[ "$UPSTREAM_V" != "$CURRENT_V" ]]; then
              REASON="Upstream release $UPSTREAM_V is newer than the subtree (${CURRENT_V:-unknown}). Syncing the subtree and building stable with compute-runtime ${{ steps.deps.outputs.latest_compute }} (Dockerfile pin $CR_CUR)."
            else
              REASON="New stack: CR ${{ steps.deps.outputs.latest_compute }} + llama.cpp $UPSTREAM_V (Dockerfile pin $CR_CUR)"
            fi
          fi

          if [ "$FORCE" == "true" ]; then
            SHOULD_BUILD=true
            REASON="Forced by manual dispatch (force=true); subtree ${CURRENT_V:-unknown} -> $UPSTREAM_V"
          fi

          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT
          echo "build_reason=$REASON" >> $GITHUB_OUTPUT
          echo "$REASON"

      # ============================================================
      # Advance the vendored subtree to the resolved release tag.
      #
      # Calls the SAME script a human would run, so the CI path and the manual
      # path cannot drift. UPSTREAM_DIR points it at the clone the resolve step
      # already made, so upstream is fetched once per run instead of twice.
      # ============================================================
      - name: Advance vendored subtree to the release tag
        id: advance
        if: steps.decide.outputs.should_advance == 'true'
        run: |
          set -e
          REF="${{ steps.upstream.outputs.upstream_v }}"
          echo "Advancing vendored subtree ${{ steps.decide.outputs.current_v }} -> $REF"
          UPSTREAM_DIR="${{ steps.upstream.outputs.upstream_dir }}" \
            scripts/sync-llama-subtree.sh "$REF"
          echo
          echo "Staged change:"
          git diff --cached --stat | tail -5

      - name: Read llama.cpp version from the vendored subtree
        id: llama
        run: |
          set -e
          MAJ=$(grep -m1 '^set(LLAMA_VERSION_MAJOR' llama.cpp/CMakeLists.txt | sed 's/.*[[:space:]]\([0-9]*\).*/\1/')
          MIN=$(grep -m1 '^set(LLAMA_VERSION_MINOR' llama.cpp/CMakeLists.txt | sed 's/.*[[:space:]]\([0-9]*\).*/\1/')
          PAT=$(grep -m1 '^set(LLAMA_VERSION_PATCH' llama.cpp/CMakeLists.txt | sed 's/.*[[:space:]]\([0-9]*\).*/\1/')
          LATEST_V="v${MAJ}.${MIN}.${PAT}"
          V_DATE=$(git log -1 --format=%cI -- llama.cpp || echo "unknown")
          echo "latest_v=$LATEST_V" >> $GITHUB_OUTPUT
          echo "v_date=$V_DATE" >> $GITHUB_OUTPUT
          echo "Vendored llama.cpp subtree now: $LATEST_V (last subtree change $V_DATE)"

      # ============================================================
      # Build stage (uses compute-runtime-derived pin set)
      # ============================================================
      - name: Set up Docker Buildx
        if: steps.decide.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.decide.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No "Refresh llama.cpp subtree" step: the vendored subtree is the
      # source of truth and is built as committed. A build therefore reproduces
      # exactly the reviewed source, and the version read above comes from that
      # same tree rather than from a remote tag that could have moved.

      - name: Compute temporary stable tag
        if: steps.decide.outputs.should_build == 'true'
        id: tag
        run: |
          TAG="server-c${{ steps.deps.outputs.latest_compute }}-${{ steps.llama.outputs.latest_v }}-$(date +%Y%m%d-%H%M)"
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT
          echo "full_image=ghcr.io/${{ github.repository }}/llama-sycl-b70:${TAG}" >> $GITHUB_OUTPUT
          echo "Using temporary tag: $TAG"

      - name: Build and push (stable candidate)
        if: steps.decide.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devops/intel.Dockerfile
          target: server
          push: true
          tags: ghcr.io/${{ github.repository }}/llama-sycl-b70:${{ steps.tag.outputs.image_tag }}
          build-args: |
            COMPUTE_RUNTIME_VERSION=${{ steps.deps.outputs.latest_compute }}
            COMPUTE_RUNTIME_VERSION_FULL=${{ steps.deps.outputs.latest_compute_full }}
            IGC_VERSION=${{ steps.deps.outputs.latest_igc }}
            IGC_VERSION_FULL=${{ steps.deps.outputs.latest_igc_full }}
            LEVEL_ZERO_VERSION=${{ steps.deps.outputs.latest_level_zero }}
            LEVEL_ZERO_UBUNTU_VERSION=${{ steps.deps.outputs.level_zero_ubuntu_version }}
            IGDGMM_VERSION=${{ steps.deps.outputs.latest_igdgmm }}
            BUILD_WEBUI=0
            GGML_SYCL_F16=ON
            GGML_SYCL_DEVICE_ARCH=bmg-g31
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Report the versions that are ACTUALLY in the pushed image, not the ones CI
      # intended to install. These diverged silently once already: the image shipped
      # libze_loader.so.1.28.6 while the issue body claimed L0 1.32.0, because the
      # oneAPI install in the same stage displaced the pinned loader. Read the truth
      # back out of the built image and fail if it does not match the pin.
      # See docs/LEVEL-ZERO-VERSION-DISCREPANCY.md.
      - name: Verify built image versions
        id: verify
        if: steps.decide.outputs.should_build == 'true'
        run: |
          set -e
          IMAGE="ghcr.io/${{ github.repository }}/llama-sycl-b70:${{ steps.tag.outputs.image_tag }}"
          docker pull "$IMAGE" >/dev/null 2>&1 || true   # present locally from the build step already
          # -f needs BOTH an escaped \$Version and an explicit \n:
          #   * "${Version}" (unescaped) is expanded by THIS step's shell, where
          #     Version is unset, so the container receives -f="" and dpkg-query
          #     fails with "may not be empty string" -> the `|| echo unknown`
          #     fallback fires and the issue reports libze1 as `unknown`.
          #   * without \n the version is emitted with no trailing newline and
          #     the loader line concatenates onto it, leaving L0_LOADER empty
          #     and failing the case below.
          ACTUAL=$(docker run --rm --entrypoint /bin/bash "$IMAGE" -lc '
            dpkg-query -W -f="\${Version}\n" libze1 2>/dev/null || echo unknown
            readlink -f /usr/lib/x86_64-linux-gnu/libze_loader.so.1 2>/dev/null | xargs -r basename
          ')
          L0_PKG=$(echo "$ACTUAL" | sed -n 1p)
          L0_LOADER=$(echo "$ACTUAL" | sed -n 2p)
          echo "libze1 package : $L0_PKG"
          echo "loader soname  : $L0_LOADER"
          echo "level_zero_actual=$L0_PKG" >> $GITHUB_OUTPUT
          echo "level_zero_loader=$L0_LOADER" >> $GITHUB_OUTPUT
          EXPECTED="${{ steps.deps.outputs.latest_level_zero }}"
          case "$L0_LOADER" in
            *".so.${EXPECTED}") echo "OK: loader matches the pinned Level Zero ${EXPECTED}" ;;
            *) echo "ERROR: pinned Level Zero ${EXPECTED} is NOT in the image (found: ${L0_LOADER})" >&2; exit 1 ;;
          esac
          # The loader check above is the real gate. This one exists so the
          # package version cannot silently regress to `unknown` again and be
          # copied into an issue as if it were a finding.
          if [ "$L0_PKG" = "unknown" ] || [ -z "$L0_PKG" ]; then
            echo "ERROR: could not read the libze1 package version from the image" >&2; exit 1
          fi

      - name: Create GitHub Issue with diff (stable)
        if: steps.decide.outputs.should_build == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.tag.outputs.image_tag }}';
            const full = '${{ steps.tag.outputs.full_image }}';
            const v = '${{ steps.llama.outputs.latest_v }}';
            const cr = '${{ steps.deps.outputs.latest_compute }}';
            const igc = '${{ steps.deps.outputs.latest_igc }}';
            const l0 = '${{ steps.deps.outputs.latest_level_zero }}';

            let diff = `**Stable candidate build**\n\n`;
            diff += `**Image**: \`${full}\`\n`;
            diff += `**llama.cpp**: ${v}\n`;
            diff += `**Compute Runtime**: ${cr} (paired versions derived from its release notes)\n`;
            diff += `**IGC**: ${igc}\n`;
            diff += `**Level Zero**: ${l0}\n`;
            diff += `**Subtree**: advanced from \`${{ steps.decide.outputs.current_v }}\` to \`${v}\` by this run\n`;
            diff += `**Image actually contains**: libze1 \`${{ steps.verify.outputs.level_zero_actual }}\`, loader \`${{ steps.verify.outputs.level_zero_loader }}\`\n`;
            diff += `**Build**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n`;
            diff += `### Next steps (on your B70)\n`;
            diff += `1. Pull: \`docker pull ${full}\`\n`;
            diff += `2. Test thoroughly with the golden production config (see docs/GOLDEN-CONFIG.md)\\n`;
            diff += `3. If good, promote to a clean release tag (e.g. server-c${cr}-${v}).\n\n`;
            diff += `Reason: ${{ steps.decide.outputs.build_reason }}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `B70 Stable Image Ready: ${tag}`,
              body: diff,
              labels: ['stable', 'B70']
            });

      # ============================================================
      # Record the advance on main.
      #
      # Runs LAST on purpose. The subtree was already replaced in the workspace
      # to build the image, but it is committed only after the build (and the
      # version check) succeeded, so a failed build leaves the repository at the
      # previous release and the next run retries instead of silently skipping
      # as "already built". It also runs when the image already existed, where it
      # is the ONLY effect of the run.
      #
      # If this push fails, nothing is lost: the image is already published and
      # the next scheduled run sees the same gap and advances again.
      # ============================================================
      - name: Record the advance on main
        if: steps.decide.outputs.should_advance == 'true'
        run: |
          set -e
          REF="${{ steps.llama.outputs.latest_v }}"
          git add -A llama.cpp
          if git diff --cached --quiet; then
            echo "Nothing staged; main already records $REF"
            exit 0
          fi
          git commit \
            -m "build(stable): auto-advance vendored subtree to $REF" \
            -m "Resolved as the newest upstream llama.cpp v* release by the scheduled stable build and synced with scripts/sync-llama-subtree.sh. The image built from this tree is server-c${{ steps.deps.outputs.latest_compute }}-${{ steps.llama.outputs.latest_v }}."
          git push origin HEAD:main && echo "Recorded $REF on main" || {
            echo "::warning::could not push the advanced subtree; main still records ${{ steps.decide.outputs.current_v }}. The next scheduled run will retry."
          }