name: Build Stable (main)

on:
  schedule:
    # Every 4 hours: check for a newer llama.cpp stable (v*) tag
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  check-and-build-stable:
    # Only run on main branch (schedule or manual)
    if: |
      github.ref_name == 'main' ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      issues: write

    steps:
      - name: Checkout repository (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ============================================================
      # Detect newest llama.cpp stable (v*) tag
      # ============================================================
      - name: Detect latest llama.cpp stable (v*) tag
        id: llama
        run: |
          git remote add upstream https://github.com/ggml-org/llama.cpp.git 2>/dev/null || true
          git fetch upstream --tags --force

          LATEST_V=$(git for-each-ref --sort=-creatordate --format '%(refname:short)' refs/tags | grep -E '^v[0-9]' | head -1)
          V_DATE=$(git for-each-ref --format='%(creatordate:iso8601)' "refs/tags/$LATEST_V")
          echo "latest_v=$LATEST_V" >> $GITHUB_OUTPUT
          echo "v_date=$V_DATE" >> $GITHUB_OUTPUT
          echo "Latest upstream stable: $LATEST_V (date: $V_DATE)"

      # ============================================================
      # Decide: rebuild only if the vendored llama.cpp is older than the
      # newest stable tag. Intel stack versions stay at the tested pins in
      # .devops/intel.Dockerfile — Intel components are released
      # independently and "latest of each" does NOT form a compatible set
      # (e.g. ocloc + IGC interface mismatches), so we never auto-bump them.
      # ============================================================
      - name: Decide if build is needed
        id: decide
        run: |
          SHOULD_BUILD=false
          REASON=""

          LATEST_V="${{ steps.llama.outputs.latest_v }}"
          LATEST_V_DATE="${{ steps.llama.outputs.v_date }}"

          if [ -d llama.cpp ]; then
            CURRENT_DATE=$(git log -1 --format=%ci -- llama.cpp 2>/dev/null || echo "1970-01-01T00:00:00Z")
          else
            CURRENT_DATE="1970-01-01T00:00:00Z"
          fi

          if [[ "$LATEST_V_DATE" > "$CURRENT_DATE" ]]; then
            SHOULD_BUILD=true
            REASON="Newer llama.cpp stable tag: $LATEST_V"
          fi

          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT
          echo "build_reason=${REASON:-No newer llama.cpp; Intel pins unchanged by design}"
          echo "should_build=$SHOULD_BUILD"

      # ============================================================
      # Build stage (only if llama.cpp moved ahead)
      # Uses the Dockerfile's tested Intel pins (no overrides).
      # ============================================================
      - name: Set up Docker Buildx
        if: steps.decide.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.decide.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh llama.cpp subtree at latest stable v tag
        if: steps.decide.outputs.should_build == 'true'
        run: |
          LATEST_V="${{ steps.llama.outputs.latest_v }}"
          echo "Refreshing llama.cpp at $LATEST_V"
          rm -rf llama.cpp
          git clone --depth 1 --branch "$LATEST_V" https://github.com/ggml-org/llama.cpp llama.cpp

      - name: Compute temporary stable tag
        if: steps.decide.outputs.should_build == 'true'
        id: tag
        run: |
          LATEST_V="${{ steps.llama.outputs.latest_v }}"
          DATE=$(date +%Y%m%d-%H%M)
          TAG="server-${LATEST_V}-${DATE}"
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT
          echo "full_image=ghcr.io/${{ github.repository }}/llama-sycl-b70:${TAG}" >> $GITHUB_OUTPUT
          echo "Using temporary tag: $TAG"

      - name: Build and push (stable candidate)
        if: steps.decide.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devops/intel.Dockerfile
          target: server
          push: true
          tags: ghcr.io/${{ github.repository }}/llama-sycl-b70:${{ steps.tag.outputs.image_tag }}
          build-args: |
            BUILD_WEBUI=0
            GGML_SYCL_F16=ON
            GGML_SYCL_DEVICE_ARCH=bmg-g31
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ============================================================
      # Create a detailed GitHub Issue for the maintainer to test on B70
      # ============================================================
      - name: Create GitHub Issue with diff (stable)
        if: steps.decide.outputs.should_build == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.tag.outputs.image_tag }}';
            const full = '${{ steps.tag.outputs.full_image }}';
            const v = '${{ steps.llama.outputs.latest_v }}';

            let diff = `**Stable candidate build**\n\n`;
            diff += `**Image**: \`${full}\`\n`;
            diff += `**llama.cpp**: ${v}\n`;
            diff += `**Build**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n`;
            diff += `**Intel stack**: pinned in \`.devops/intel.Dockerfile\` (unchanged by CI on purpose — Intel components are only built when a compatible pin is tested manually).\n\n`;
            diff += `### Next steps (on your B70)\n`;
            diff += `1. Pull the candidate:\n   docker pull ${full}\n\n`;
            diff += `2. Test thoroughly (especially MTP + 128k + q8_0)\n`;
            diff += `3. If good, promote to a clean release tag (e.g. server-${v}).\n\n`;
            diff += `Reason: ${{ steps.decide.outputs.build_reason }}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `B70 Stable Image Ready: ${tag}`,
              body: diff,
              labels: ['stable', 'B70']
            });