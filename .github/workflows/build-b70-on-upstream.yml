name: Build B70 Image (b/v logic)

on:
  schedule:
    # Every 4 hours: check for new stable v* release (main branch)
    - cron: '0 */4 * * *'
    # Weekly (Monday 09:00 UTC): check for latest b* build (dev branch)
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode: stable (v tag) or dev (b tag). Default auto based on branch.'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - stable
          - dev

jobs:
  build-stable:
    # Run on main branch schedule or explicit stable dispatch
    if: |
      (github.ref_name == 'main' && github.event_name == 'schedule') ||
      (github.event.inputs.mode == 'stable') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'auto' && github.ref_name == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream and detect latest stable v tag
        id: detect-v
        run: |
          git remote add upstream https://github.com/ggml-org/llama.cpp.git 2>/dev/null
          git fetch upstream --tags

          LATEST_V=$(git for-each-ref --sort=-creatordate --format '%(refname:short)' refs/tags | grep -E '^v[0-9]' | head -1)
          echo "latest_v=$LATEST_V" >> $GITHUB_OUTPUT

          # Current subtree commit date (approximate)
          CURRENT_SUBTREE_DATE=$(git log -1 --format=%ci -- llama.cpp 2>/dev/null || echo "1970-01-01")
          echo "current_subtree_date=$CURRENT_SUBTREE_DATE" >> $GITHUB_OUTPUT

          V_DATE=$(git for-each-ref --format='%(creatordate:iso8601)' "refs/tags/$LATEST_V")
          echo "v_date=$V_DATE" >> $GITHUB_OUTPUT

          if [[ "$V_DATE" > "$CURRENT_SUBTREE_DATE" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Will build for new stable $LATEST_V"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "No newer v tag than current subtree."
          fi

      - name: Set up Docker Buildx
        if: steps.detect-v.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.detect-v.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout fresh llama.cpp at tag (instead of broken subtree)
        if: steps.detect-v.outputs.should_build == 'true'
        run: |
          LATEST_V="${{ steps.detect-v.outputs.latest_v }}"
          echo "Cloning fresh llama.cpp at $LATEST_V (avoids broken subtree split-hash)"
          rm -rf llama.cpp
          git clone --depth 1 --branch "$LATEST_V" https://github.com/ggml-org/llama.cpp llama.cpp

      - name: Compute immutable tag
        if: steps.detect-v.outputs.should_build == 'true'
        id: tag
        run: |
          LATEST_V="${{ steps.detect-v.outputs.latest_v }}"
          DATE=$(date +%Y%m%d-%H%M)
          TAG="server-${LATEST_V}-${DATE}"
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT
          echo "full_image=ghcr.io/${{ github.repository }}/llama-sycl-b70:${TAG}" >> $GITHUB_OUTPUT

      - name: Build and push (stable)
        if: steps.detect-v.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devops/intel.Dockerfile
          target: server
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/llama-sycl-b70:${{ steps.tag.outputs.image_tag }}
          build-args: |
            ONEAPI_VERSION=2026.1.2-devel-ubuntu24.04
            BUILD_WEBUI=0
            GGML_SYCL_F16=ON
            GGML_SYCL_DEVICE_ARCH=bmg-g31
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify via GitHub Issue (stable)
        if: steps.detect-v.outputs.should_build == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.tag.outputs.image_tag }}';
            const full = '${{ steps.tag.outputs.full_image }}';
            const v = '${{ steps.detect-v.outputs.latest_v }}';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `B70 Stable Image Ready: ${tag}`,
              body: `**Stable v release build**\n\n` +
                    `**Image**: \`${full}\`\n\n` +
                    `**Upstream**: ${v}\n\n` +
                    `**Build**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
                    `**Next steps on B70**:\n` +
                    `1. Pull and test:\n` +
                    `   scripts/build-b70-image.sh (or your local test script) ${tag}\n\n` +
                    `2. If tests pass, promote:\n` +
                    `   workspace-only promote script (not in repo) ${tag}\n\n` +
                    `This tag is immutable. Old :server remains unchanged until you promote.`
            });

  build-weekly-dev:
    # Weekly (Monday 09:00 UTC) schedule or explicit 'dev' dispatch.
    # The job does `ref: dev` checkout so it uses dev-branch Dockerfile + source.
    if: |
      (github.event.schedule == '0 9 * * 1') ||   # Monday cron (runs on default=main but we checkout dev)
      (github.event.inputs.mode == 'dev') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      issues: write

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream and decide b vs v
        id: detect-b
        run: |
          git remote add upstream https://github.com/ggml-org/llama.cpp.git 2>/dev/null
          git fetch upstream --tags

          LATEST_B=$(git for-each-ref --sort=-creatordate --format '%(refname:short)' refs/tags | grep -E '^b[0-9]+' | head -1)
          LATEST_V=$(git for-each-ref --sort=-creatordate --format '%(refname:short)' refs/tags | grep -E '^v[0-9]' | head -1)

          echo "latest_b=$LATEST_B" >> $GITHUB_OUTPUT
          echo "latest_v=$LATEST_V" >> $GITHUB_OUTPUT

          B_DATE=$(git for-each-ref --format='%(creatordate:iso8601)' "refs/tags/$LATEST_B")
          V_DATE=$(git for-each-ref --format='%(creatordate:iso8601)' "refs/tags/$LATEST_V")

          echo "b_date=$B_DATE" >> $GITHUB_OUTPUT
          echo "v_date=$V_DATE" >> $GITHUB_OUTPUT

          if [[ "$B_DATE" > "$V_DATE" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "b is newer than current stable v — will build weekly dev image"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "Latest b ($LATEST_B) is not newer than v ($LATEST_V). Skipping weekly dev build."
          fi

      - name: Set up Docker Buildx
        if: steps.detect-b.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.detect-b.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout fresh llama.cpp at tag (instead of broken subtree)
        if: steps.detect-b.outputs.should_build == 'true'
        run: |
          LATEST_B="${{ steps.detect-b.outputs.latest_b }}"
          echo "Cloning fresh llama.cpp at $LATEST_B (avoids broken subtree split-hash)"
          rm -rf llama.cpp
          git clone --depth 1 --branch "$LATEST_B" https://github.com/ggml-org/llama.cpp llama.cpp

      - name: Compute immutable tag (weekly dev)
        if: steps.detect-b.outputs.should_build == 'true'
        id: tag
        run: |
          LATEST_B="${{ steps.detect-b.outputs.latest_b }}"
          DATE=$(date +%Y%m%d)
          TAG="server-${LATEST_B}-weekly-${DATE}"
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT
          echo "full_image=ghcr.io/${{ github.repository }}/llama-sycl-b70:${TAG}" >> $GITHUB_OUTPUT

      - name: Build and push (weekly dev)
        if: steps.detect-b.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devops/intel.Dockerfile
          target: server
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/llama-sycl-b70:${{ steps.tag.outputs.image_tag }}
          build-args: |
            ONEAPI_VERSION=2026.1.2-devel-ubuntu24.04
            BUILD_WEBUI=0
            GGML_SYCL_F16=ON
            GGML_SYCL_DEVICE_ARCH=bmg-g31
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify via GitHub Issue (weekly dev)
        if: steps.detect-b.outputs.should_build == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.tag.outputs.image_tag }}';
            const full = '${{ steps.tag.outputs.full_image }}';
            const b = '${{ steps.detect-b.outputs.latest_b }}';
            const v = '${{ steps.detect-b.outputs.latest_v }}';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `B70 Weekly Dev Image Ready: ${tag}`,
              body: `**Weekly dev build (b tag)**\n\n` +
                    `**Image**: \`${full}\`\n\n` +
                    `**b tag**: ${b}\n` +
                    `**Compared against stable**: ${v}\n\n` +
                    `**Build**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
                    `**Next steps on B70**:\n` +
                    `1. Pull and test:\n` +
                    `   scripts/build-b70-image.sh (or your local test script) ${tag}\n\n` +
                    `2. If tests pass, promote (optional for dev):\n` +
                    `   workspace-only promote script (not in repo) ${tag}\n\n` +
                    `Note: This is a development weekly snapshot. Only promote to :server if you explicitly want to.`
            });
