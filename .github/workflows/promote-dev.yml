name: Promote B70 dev tag

# Moves the floating `:server-dev` tag onto a dev candidate that has passed the
# full B70 test suite. Manifest-only: no layers are re-uploaded and nothing is
# rebuilt. Promote by SOURCE TAG, and confirm the resulting digest equals the
# digest that was actually tested before closing the issue.
#
# `:stable` is deliberately NOT touched here — use promote-stable.yml for that.
# Keeping the two apart is what stops a dev candidate from silently becoming
# production.
on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Source dev candidate tag to promote to :server-dev
        required: true
        default: server-dev-b11117-c26.35.39758.10-20260923-0200
      expected_digest:
        description: 'Optional guard: full sha256:... the source must resolve to'
        required: false
        default: ''

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote candidate to :server-dev
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository }}/llama-sycl-b70"
          SRC="$IMAGE:${{ inputs.source_tag }}"
          DST="$IMAGE:server-dev"

          SRC_DIGEST=$(docker buildx imagetools inspect "$SRC" --format '{{.Manifest.Digest}}')
          echo "source  ${{ inputs.source_tag }} -> $SRC_DIGEST"

          # Optional guard: refuse to move the floating tag if the candidate is not
          # the artifact that was tested. Tags are mutable; the digest is the record.
          EXPECTED="${{ inputs.expected_digest }}"
          if [ -n "$EXPECTED" ] && [ "$SRC_DIGEST" != "$EXPECTED" ]; then
            echo "ERROR: source digest $SRC_DIGEST != expected $EXPECTED" >&2
            exit 1
          fi

          PREV=$(docker buildx imagetools inspect "$DST" --format '{{.Manifest.Digest}}' || true)
          echo "previous :server-dev -> ${PREV:-<none>}"

          docker buildx imagetools create --tag "$DST" "$SRC"

          NEW=$(docker buildx imagetools inspect "$DST" --format '{{.Manifest.Digest}}')
          echo "new      :server-dev -> $NEW"

          # The promote is only correct if the floating tag now resolves to the
          # exact bytes of the tested candidate.
          if [ "$NEW" != "$SRC_DIGEST" ]; then
            echo "ERROR: :server-dev ($NEW) does not match the source ($SRC_DIGEST)" >&2
            exit 1
          fi
          echo "OK: :server-dev == ${{ inputs.source_tag }} @ $NEW"

      - name: Advance :latest (monotonic by build date)
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository }}/llama-sycl-b70"
          SRC="$IMAGE:${{ inputs.source_tag }}"
          LAT="$IMAGE:latest"

          # :latest = "last tested + promoted image", on EITHER channel. It is
          # monotonic by IMAGE BUILD TIME, not by promote order: a dev build can
          # legitimately be newer than a stable release promoted afterwards, and
          # `docker pull :latest` must never hand someone bits older than what
          # they already got. So an older digest leaves :latest untouched.
          #
          # We read the image's build time (leading field of `{{.Image}}`), NOT the
          # manifest push time — re-pushing a tag must not make old bits look new.
          # `{{.Image}}` prints a Go struct, so match only the timestamp prefix of
          # the first line; the rest of the struct is very long and multi-line.
          img_created() {
            docker buildx imagetools inspect "$1" --format '{{.Image}}' 2>/dev/null \
              | head -1 \
              | sed -nE 's/^\{([0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2})\.[0-9]+ \+0000 UTC.*/\1 +0000/p'
          }
          to_epoch() {
            [ -n "$1" ] || return 1
            date -u -d "$1" +%s 2>/dev/null
          }

          NEW_TS=$(img_created "$SRC")
          CUR_TS=$(img_created "$LAT" || true)
          NEW_E=$(to_epoch "$NEW_TS" || true)
          CUR_E=$(to_epoch "$CUR_TS" || true)

          echo "candidate build time : ${NEW_TS:-<unreadable>}"
          echo ":latest   build time : ${CUR_TS:-<none>}"

          if [ -z "$CUR_E" ]; then
            if docker buildx imagetools inspect "$LAT" >/dev/null 2>&1; then
              echo "::warning:::latest exists but its build time is unreadable; not moving it"
            else
              docker buildx imagetools create --tag "$LAT" "$SRC"
              echo "OK: :latest created (${NEW_TS:-unknown time})"
            fi
          elif [ -z "$NEW_E" ]; then
            echo "::warning::cannot read the candidate's build time; leaving :latest untouched"
          elif [ "$NEW_E" -gt "$CUR_E" ]; then
            docker buildx imagetools create --tag "$LAT" "$SRC"
            echo "OK: :latest advanced $CUR_TS -> $NEW_TS"
          elif [ "$NEW_E" -eq "$CUR_E" ]; then
            echo "OK: :latest already at this build; no change"
          else
            echo "OK: :latest NOT moved — candidate ($NEW_TS) is OLDER than :latest ($CUR_TS)"
            echo "    :latest is monotonic by build date; promoting older bits never pulls it back."
          fi

      - name: Confirm :stable was not touched
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository }}/llama-sycl-b70"
          echo "stable -> $(docker buildx imagetools inspect "$IMAGE:stable" --format '{{.Manifest.Digest}}' || echo '<none>')"
