name: Update llama.cpp Subtree

on:
  schedule:
    # Check every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update-subtree:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/ggml-org/llama.cpp.git 2>/dev/null || true
          git fetch upstream

      - name: Update subtree
        id: subtree
        run: |
          BEFORE=$(git rev-parse HEAD)
          
          # Pull latest from upstream main into the subtree
          git subtree pull --prefix=llama.cpp upstream main \
            --squash \
            -m "chore: update llama.cpp subtree to $(git rev-parse --short upstream/main)"
          
          AFTER=$(git rev-parse HEAD)
          
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
            echo "No new commits from upstream."
          else
            echo "no_changes=false" >> $GITHUB_OUTPUT
            echo "Subtree updated."
          fi

      - name: Create Pull Request (if changes)
        if: steps.subtree.outputs.no_changes == 'false'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update llama.cpp subtree"
          branch: chore/update-llama-subtree
          title: "chore: update llama.cpp subtree from upstream"
          body: |
            Automatic subtree update from https://github.com/ggml-org/llama.cpp

            This PR brings in the latest changes from upstream main.

            **Please review** before merging:
            - Check that the B70-specific Dockerfile and build still work
            - Run a quick test build if possible
            - Look for breaking changes in ggml-sycl or server code

            Triggered by: scheduled workflow
          labels: |
            subtree-update
            automated
          delete-branch: true
