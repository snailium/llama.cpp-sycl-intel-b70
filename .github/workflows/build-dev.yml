name: Build Dev (dev branch)

on:
  schedule:
    # Weekly dev build — Saturday 00:00 UTC
    - cron: '0 0 * * 6'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a dev build even if logic says skip'
        required: false
        default: 'false'
        type: boolean

jobs:
  check-and-build-dev:
    # Only run on dev branch (schedule or manual)
    if: |
      github.ref_name == 'dev' ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      issues: write

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ============================================================
      # Detect llama.cpp tags, decide 2a (point to stable) vs 2b (build dev)
      # ============================================================
      - name: Detect latest llama.cpp v* and b* tags
        id: llama
        run: |
          git remote add upstream https://github.com/ggml-org/llama.cpp.git 2>/dev/null || true
          git fetch upstream --tags --force
          LATEST_V=$(git for-each-ref --sort=-creatordate --format '%(refname:short)' refs/tags | grep -E '^v[0-9]' | head -1)
          LATEST_B=$(git for-each-ref --sort=-creatordate --format '%(refname:short)' refs/tags | grep -E '^b[0-9]+' | head -1)
          B_DATE=$(git for-each-ref --format='%(creatordate:iso8601)' "refs/tags/$LATEST_B")
          V_DATE=$(git for-each-ref --format='%(creatordate:iso8601)' "refs/tags/$LATEST_V")
          echo "latest_v=$LATEST_V" >> $GITHUB_OUTPUT
          echo "latest_b=$LATEST_B" >> $GITHUB_OUTPUT
          if [[ "$B_DATE" > "$V_DATE" ]]; then
            echo "is_release_tag=false" >> $GITHUB_OUTPUT
          else
            echo "is_release_tag=true" >> $GITHUB_OUTPUT
          fi

      # ============================================================
      # Derive the Intel stack from the latest compute-runtime (single
      # source of truth — its release notes list the exact paired IGC /
      # level-zero / gmmlib versions).
      # ============================================================
      - name: Detect latest compute-runtime and derive paired Intel stack
        id: deps
        run: |
          set -e
          CRREL=$(curl -s https://api.github.com/repos/intel/compute-runtime/releases/latest)
          CR=$(echo "$CRREL" | jq -r '.tag_name')
          BODY=$(echo "$CRREL" | jq -r '.body')
          IGC=$(echo "$BODY" | grep -oE 'intel-graphics-compiler@v[0-9]+(\.[0-9]+)+' | head -1 | cut -d@ -f2)
          L0=$(echo "$BODY"  | grep -oE 'level-zero@v[0-9]+(\.[0-9]+)+' | head -1 | cut -d@ -f2)
          GMM=$(echo "$BODY" | grep -oE 'intel-gmmlib-[0-9]+(\.[0-9]+)+' | head -1 | sed -E 's/.*-([0-9.]+)/\1/')
          CRF=$(echo "$CRREL" | jq -r '.assets[] | select((.name|contains("ocloc_")) and (.name|endswith(".deb"))) | .name' | head -1 | sed -E 's/.*ocloc_([0-9.-]+)_amd64.*/\1/')
          [ -z "$CRF" ] && CRF="${CR}-0"
          IGREL=$(curl -s "https://api.github.com/repos/intel/intel-graphics-compiler/releases/tags/$IGC")
          IGCF=$(echo "$IGREL" | jq -r '.assets[] | select((.name|contains("igc-core-")) and (.name|endswith(".deb")) and ((.name|contains("devel"))|not)) | .name' | head -1 | sed -E 's/.*igc-core-([0-9_+.]+)_amd64.*/\1/')
          LZREL=$(curl -s "https://api.github.com/repos/oneapi-src/level-zero/releases/tags/$L0")
          LZU=$(echo "$LZREL" | jq -r '.assets[] | select((.name|endswith("_amd64.deb")) and (.name|test("u[0-9.]"))) | .name' | head -1 | sed -E 's/.*(u[0-9.]+)_amd64.deb.*/\1/')
          [ -z "$LZU" ] && LZU="u24.04"
          echo "latest_compute=$CR" >> $GITHUB_OUTPUT
          echo "latest_compute_full=$CRF" >> $GITHUB_OUTPUT
          echo "latest_igc=$IGC" >> $GITHUB_OUTPUT
          echo "latest_igc_full=$IGCF" >> $GITHUB_OUTPUT
          echo "latest_level_zero=${L0#v}" >> $GITHUB_OUTPUT
          echo "level_zero_ubuntu_version=$LZU" >> $GITHUB_OUTPUT
          echo "latest_igdgmm=$GMM" >> $GITHUB_OUTPUT
          echo "Derived from compute-runtime $CR: IGC=$IGC L0=${L0#v} gmmlib=$GMM"

      # ============================================================
      # Decision: 2a (point-to-stable / skip) or 2b (build dev from b tag)
      # ============================================================
      - name: Decide dev build strategy
        id: decide
        run: |
          IS_RELEASE="${{ steps.llama.outputs.is_release_tag }}"
          LATEST_B="${{ steps.llama.outputs.latest_b }}"
          FORCE="${{ github.event.inputs.force || 'false' }}"
          if [[ "$FORCE" == "true" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT; echo "strategy=force" >> $GITHUB_OUTPUT
            echo "reason=Forced by manual dispatch"; exit 0
          fi
          if [[ "$IS_RELEASE" == "true" ]]; then
            echo "should_build=false" >> $GITHUB_OUTPUT; echo "strategy=point-to-stable" >> $GITHUB_OUTPUT
            echo "reason=Latest llama.cpp tag is a release (v*). Suggest pointing the dev image to the latest stable."
          else
            echo "should_build=true" >> $GITHUB_OUTPUT; echo "strategy=build-dev" >> $GITHUB_OUTPUT
            echo "latest_b=$LATEST_B" >> $GITHUB_OUTPUT
            echo "reason=Newer b tag $LATEST_B available. Building dev from b tag with compute-runtime-derived Intel pins."
          fi

      - name: Create guidance issue (2a - point dev to stable)
        if: steps.decide.outputs.strategy == 'point-to-stable'
        uses: actions/github-script@v7
        with:
          script: |
            const latest = '${{ steps.llama.outputs.latest_v }}';
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `B70 Dev: Latest llama.cpp is release tag (${latest}) — align dev image?`,
              body: `The latest tag is **${latest}** (a release). Point the dev image to the latest stable, or re-run with \`force: true\`.`,
              labels: ['dev','B70']
            });

      - name: Set up Docker Buildx
        if: steps.decide.outputs.should_build == 'true' && steps.decide.outputs.strategy == 'build-dev'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.decide.outputs.should_build == 'true' && steps.decide.outputs.strategy == 'build-dev'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone llama.cpp at latest b tag (for dev)
        if: steps.decide.outputs.should_build == 'true' && steps.decide.outputs.strategy == 'build-dev'
        id: clone
        run: |
          rm -rf llama.cpp
          git clone --depth 1 --branch "${{ steps.llama.outputs.latest_b }}" https://github.com/ggml-org/llama.cpp llama.cpp

      - name: Compute dev temporary tag
        if: steps.decide.outputs.should_build == 'true' && steps.decide.outputs.strategy == 'build-dev'
        id: tag
        run: |
          TAG="server-dev-${{ steps.llama.outputs.latest_b }}-c${{ steps.deps.outputs.latest_compute }}-$(date +%Y%m%d-%H%M)"
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT
          echo "full_image=ghcr.io/${{ github.repository }}/llama-sycl-b70:${TAG}" >> $GITHUB_OUTPUT

      - name: Build and push (dev candidate)
        if: steps.decide.outputs.should_build == 'true' && steps.decide.outputs.strategy == 'build-dev'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devops/intel.Dockerfile
          target: server
          push: true
          tags: ghcr.io/${{ github.repository }}/llama-sycl-b70:${{ steps.tag.outputs.image_tag }}
          build-args: |
            COMPUTE_RUNTIME_VERSION=${{ steps.deps.outputs.latest_compute }}
            COMPUTE_RUNTIME_VERSION_FULL=${{ steps.deps.outputs.latest_compute_full }}
            IGC_VERSION=${{ steps.deps.outputs.latest_igc }}
            IGC_VERSION_FULL=${{ steps.deps.outputs.latest_igc_full }}
            LEVEL_ZERO_VERSION=${{ steps.deps.outputs.latest_level_zero }}
            LEVEL_ZERO_UBUNTU_VERSION=${{ steps.deps.outputs.level_zero_ubuntu_version }}
            IGDGMM_VERSION=${{ steps.deps.outputs.latest_igdgmm }}
            BUILD_WEBUI=0
            GGML_SYCL_F16=ON
            GGML_SYCL_DEVICE_ARCH=bmg-g31
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create detailed Issue (dev build)
        if: steps.decide.outputs.should_build == 'true' && steps.decide.outputs.strategy == 'build-dev'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.tag.outputs.image_tag }}';
            const full = '${{ steps.tag.outputs.full_image }}';
            let body = `**Dev weekly build**\n\n`;
            body += `**Image**: \`${full}\`\n`;
            body += `**llama.cpp b tag**: ${{ steps.llama.outputs.latest_b }}\n`;
            body += `**Compute Runtime**: ${{ steps.deps.outputs.latest_compute }} (paired IGC ${{ steps.deps.outputs.latest_igc }}, L0 ${{ steps.deps.outputs.latest_level_zero }})\n`;
            body += `**Build**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n`;
            body += `**Reason**: ${{ steps.decide.outputs.reason }}\n\n`;
            body += `Development snapshot. Use at your own risk.\n`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `B70 Dev Image Ready: ${tag}`, body, labels: ['dev','B70']
            });