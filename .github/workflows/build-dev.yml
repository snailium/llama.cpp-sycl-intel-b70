name: Build Dev (dev branch)

on:
  schedule:
    # Weekly dev build — Saturday 00:00 UTC
    - cron: '0 0 * * 6'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a dev build even if logic says skip'
        required: false
        default: 'false'
        type: boolean

jobs:
  check-and-build-dev:
    # Only run on dev branch (schedule or manual)
    if: |
      github.ref_name == 'dev' ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      issues: write

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ============================================================
      # Detect newest llama.cpp tags, decide 2a (point to stable) vs 2b (build dev)
      # ============================================================
      - name: Fetch upstream llama.cpp latest v* and b* tags
        id: llama
        run: |
          git remote add upstream https://github.com/ggml-org/llama.cpp.git 2>/dev/null || true
          git fetch upstream --tags --force

          LATEST_V=$(git for-each-ref --sort=-creatordate --format '%(refname:short)' refs/tags | grep -E '^v[0-9]' | head -1)
          LATEST_B=$(git for-each-ref --sort=-creatordate --format '%(refname:short)' refs/tags | grep -E '^b[0-9]+' | head -1)
          V_DATE=$(git for-each-ref --format='%(creatordate:iso8601)' "refs/tags/$LATEST_V")
          B_DATE=$(git for-each-ref --format='%(creatordate:iso8601)' "refs/tags/$LATEST_B")

          echo "latest_v=$LATEST_V" >> $GITHUB_OUTPUT
          echo "latest_b=$LATEST_B" >> $GITHUB_OUTPUT
          echo "v_date=$V_DATE" >> $GITHUB_OUTPUT
          echo "b_date=$B_DATE" >> $GITHUB_OUTPUT

          if [[ "$B_DATE" > "$V_DATE" ]]; then
            echo "is_release_tag=false" >> $GITHUB_OUTPUT
            echo "Newer b tag ($LATEST_B) than v ($LATEST_V) — will build dev"
          else
            echo "is_release_tag=true" >> $GITHUB_OUTPUT
            echo "Latest tag is v* release ($LATEST_V); no newer b — skip dev build"
          fi

      # ============================================================
      # Decision: 2a (point-to-stable / skip) or 2b (build dev from b tag).
      # Uses the Dockerfile's tested Intel pins — never auto-bumps IGC /
      # compute-runtime / level-zero independently (released separately and
      # "latest of each" does not form a compatible stack).
      # ============================================================
      - name: Decide dev build strategy
        id: decide
        run: |
          IS_RELEASE="${{ steps.llama.outputs.is_release_tag }}"
          LATEST_B="${{ steps.llama.outputs.latest_b }}"
          FORCE="${{ github.event.inputs.force || 'false' }}"

          if [[ "$FORCE" == "true" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "strategy=force" >> $GITHUB_OUTPUT
            echo "reason=Forced by manual dispatch"
            exit 0
          fi

          if [[ "$IS_RELEASE" == "true" ]]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "strategy=point-to-stable" >> $GITHUB_OUTPUT
            echo "reason=Latest llama.cpp tag is a release (v*). Suggest pointing the dev image to the latest stable."
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "strategy=build-dev" >> $GITHUB_OUTPUT
            echo "latest_b=$LATEST_B" >> $GITHUB_OUTPUT
            echo "reason=Newer b tag $LATEST_B available. Building dev from b tag with Dockerfile Intel pins."
          fi

      # ============================================================
      # 2a path: skip build, open guidance issue
      # ============================================================
      - name: Create guidance issue (2a - point dev to stable)
        if: steps.decide.outputs.strategy == 'point-to-stable'
        uses: actions/github-script@v7
        with:
          script: |
            const latest = '${{ steps.llama.outputs.latest_v }}';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `B70 Dev: Latest llama.cpp is release tag (${latest}) — align dev image?`,
              body: `**Analysis**\n\n` +
                    `The latest tag on ggml-org/llama.cpp is **${latest}** (a release / v* tag).\n\n` +
                    `Per current policy the dev branch should track a stable release until new dev work appears.\n\n` +
                    `**Recommended action**\n` +
                    `1. Update dev references / examples to use the latest stable image.\n` +
                    `2. Optionally create a dev tag pointing at the current stable image (e.g. \`server-dev-${latest}\`).\n\n` +
                    `Force a build anyway with \`force: true\`.`,
              labels: ['dev', 'B70']
            });

      # ============================================================
      # 2b path: build the dev image
      # ============================================================
      - name: Set up Docker Buildx
        if: steps.decide.outputs.should_build == 'true' && steps.decide.outputs.strategy == 'build-dev'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.decide.outputs.should_build == 'true' && steps.decide.outputs.strategy == 'build-dev'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone llama.cpp at latest b tag (for dev)
        if: steps.decide.outputs.should_build == 'true' && steps.decide.outputs.strategy == 'build-dev'
        id: clone
        run: |
          LATEST_B="${{ steps.llama.outputs.latest_b }}"
          echo "Cloning llama.cpp at b tag: $LATEST_B"
          rm -rf llama.cpp
          git clone --depth 1 --branch "$LATEST_B" https://github.com/ggml-org/llama.cpp llama.cpp

      - name: Compute dev temporary tag
        if: steps.decide.outputs.should_build == 'true' && steps.decide.outputs.strategy == 'build-dev'
        id: tag
        run: |
          LATEST_B="${{ steps.llama.outputs.latest_b }}"
          DATE=$(date +%Y%m%d-%H%M)
          TAG="server-${LATEST_B}-weekly-${DATE}"
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT
          echo "full_image=ghcr.io/${{ github.repository }}/llama-sycl-b70:${TAG}" >> $GITHUB_OUTPUT
          echo "Dev temp tag: $TAG (based on $LATEST_B)"

      - name: Build and push (dev candidate)
        if: steps.decide.outputs.should_build == 'true' && steps.decide.outputs.strategy == 'build-dev'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devops/intel.Dockerfile
          target: server
          push: true
          tags: ghcr.io/${{ github.repository }}/llama-sycl-b70:${{ steps.tag.outputs.image_tag }}
          build-args: |
            BUILD_WEBUI=0
            GGML_SYCL_F16=ON
            GGML_SYCL_DEVICE_ARCH=bmg-g31
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create detailed Issue (dev build)
        if: steps.decide.outputs.should_build == 'true' && steps.decide.outputs.strategy == 'build-dev'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.tag.outputs.image_tag }}';
            const full = '${{ steps.tag.outputs.full_image }}';
            const reason = '${{ steps.decide.outputs.reason }}';

            let body = `**Dev weekly build**\n\n`;
            body += `**Image**: \`${full}\`\n`;
            body += `**llama.cpp b tag**: ${{ steps.llama.outputs.latest_b }}\n`;
            body += `**Build**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n`;
            body += `**Intel stack**: pinned in \`.devops/intel.Dockerfile\` (not auto-bumped — Intel components are released independently and may not form a compatible set).\n\n`;
            body += `**Reason**: ${reason}\n\n`;
            body += `### Next steps on B70\n`;
            body += `1. Pull: \`docker pull ${full}\`\n`;
            body += `2. Test (MTP + long context recommended)\n`;
            body += `3. When happy, create a proper dev tag.\n\n`;
            body += `This is a development snapshot. Use at your own risk.`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `B70 Dev Image Ready: ${tag}`,
              body: body,
              labels: ['dev', 'B70']
            });