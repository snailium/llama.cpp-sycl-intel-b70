name: Build Dev (dev branch)

on:
  schedule:
    # Weekly dev build — Saturday 00:00 UTC
    - cron: '0 0 * * 6'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a dev build even if logic says skip'
        required: false
        default: 'false'
        type: boolean

jobs:
  check-and-build-dev:
    # Run on scheduled weekly builds (fires on the default branch) or manual
    # dispatch on the dev branch. Without the schedule clause the cron fired on
    # main with event_name=schedule and ref_name=main -> condition was never
    # true -> the dev job was silently skipped every Saturday.
    if: |
      github.ref_name == 'dev' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      # contents: write is required because the dev build AUTO-ADVANCES the
      # vendored subtree: after a successful build it commits the synced tree
      # back to dev so the repository keeps recording the exact source that was
      # built. Pushes made with GITHUB_TOKEN do not start new workflow runs, so
      # this cannot loop.
      contents: write
      packages: write
      issues: write

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ============================================================
      # Resolve the newest upstream llama.cpp tag.
      #
      # The dev build AUTO-ADVANCES. It resolves the newest b* tag from
      # upstream and syncs the vendored subtree to it before building, so a new
      # llama.cpp dev tag enters the image on the next scheduled run with no
      # manual step. The vendored tree is still the build source — what CI
      # compiles is what gets committed — but advancing it is now automatic.
      #
      # This replaces the earlier behaviour of reading the b tag ONLY from the
      # committed .subtree-upstream and never consulting upstream. That made a
      # dev image reproducible but also made every advance a manual act, which
      # meant the weekly cron rebuilt the same tag forever and then skipped as
      # a duplicate. Reproducibility is kept by recording the resolution in the
      # provenance file and committing it back (see "Record the advance").
      #
      # `is_release_tag` preserves the 2a signal: if upstream's newest tag
      # overall is a v* release (newer than the newest b*), then building an
      # older b* would be wrong, so dev reports "point at stable" instead.
      # ============================================================
      - name: Resolve newest upstream llama.cpp tag
        id: upstream
        run: |
          set -e
          UP="$RUNNER_TEMP/llama-upstream"
          rm -rf "$UP"
          # Partial clone: we only need tags and their dates, never file
          # contents here. The subtree sync reads the same clone afterwards.
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/ggml-org/llama.cpp.git "$UP"
          git -C "$UP" fetch --quiet --tags --force origin "+refs/tags/*:refs/tags/*"

          # --sort=-creatordate puts the newest tag first, so the first match of
          # each pattern is the newest of that kind. grep -m1 (not `| head -1`)
          # so grep is the last writer in the pipeline: with `head -1` grep gets
          # SIGPIPE and writes "Broken pipe" noise into the log on every run.
          TAGS=$(git -C "$UP" for-each-ref --sort=-creatordate --format '%(refname:short)' refs/tags)
          LATEST_B=$(printf '%s\n' "$TAGS" | grep -m1 -E '^b[0-9]+$')
          LATEST_V=$(printf '%s\n' "$TAGS" | grep -m1 -E '^v[0-9]+\.[0-9]+\.[0-9]+$')
          [ -n "$LATEST_B" ] || { echo "::error::upstream has no b* tag"; exit 1; }
          [ -n "$LATEST_V" ] || { echo "::error::upstream has no v* tag"; exit 1; }

          B_DATE=$(git -C "$UP" for-each-ref --format='%(creatordate:unix)' "refs/tags/$LATEST_B")
          V_DATE=$(git -C "$UP" for-each-ref --format='%(creatordate:unix)' "refs/tags/$LATEST_V")
          if [ "$V_DATE" -gt "$B_DATE" ]; then
            IS_RELEASE=true
          else
            IS_RELEASE=false
          fi

          echo "upstream_dir=$UP" >> $GITHUB_OUTPUT
          echo "latest_b=$LATEST_B" >> $GITHUB_OUTPUT
          echo "latest_v=$LATEST_V" >> $GITHUB_OUTPUT
          echo "is_release_tag=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "Upstream newest: b=$LATEST_B ($(date -u -d "@$B_DATE" +%F)), v=$LATEST_V ($(date -u -d "@$V_DATE" +%F)) -> is_release_tag=$IS_RELEASE"

      # ============================================================
      # Derive the Intel stack from the latest compute-runtime (single
      # source of truth — its release notes list the exact paired IGC /
      # level-zero / gmmlib versions).
      # ============================================================
      - name: Detect latest compute-runtime and derive paired Intel stack
        id: deps
        run: |
          set -e
          CRREL=$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/intel/compute-runtime/releases/latest)
          CR=$(echo "$CRREL" | jq -r '.tag_name')
          BODY=$(echo "$CRREL" | jq -r '.body')
          IGC=$(echo "$BODY" | grep -oE 'intel-graphics-compiler@v[0-9]+(\.[0-9]+)+' | head -1 | cut -d@ -f2)
          L0=$(echo "$BODY"  | grep -oE 'level-zero@v[0-9]+(\.[0-9]+)+' | head -1 | cut -d@ -f2)
          GMM=$(echo "$BODY" | grep -oE 'intel-gmmlib-[0-9]+(\.[0-9]+)+' | head -1 | sed -E 's/.*-([0-9.]+)/\1/')
          [ -z "$IGC" ] && { echo "ERR: failed to extract IGC from compute-runtime $CR release notes" >&2; exit 1; }
          [ -z "$L0" ]  && { echo "ERR: failed to extract level-zero from compute-runtime $CR release notes" >&2; exit 1; }
          [ -z "$GMM" ] && { echo "ERR: failed to extract gmmlib from compute-runtime $CR release notes" >&2; exit 1; }
          CRF=$(echo "$CRREL" | jq -r '.assets[] | select((.name|contains("ocloc_")) and (.name|endswith(".deb"))) | .name' | head -1 | sed -E 's/.*ocloc_([0-9.-]+)_amd64.*/\1/')
          [ -z "$CRF" ] && CRF="${CR}-0"
          IGREL=$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/intel/intel-graphics-compiler/releases/tags/$IGC")
          IGCF=$(echo "$IGREL" | jq -r '.assets[] | select((.name|contains("igc-core-")) and (.name|endswith(".deb")) and ((.name|contains("devel"))|not)) | .name' | head -1 | sed -E 's/.*igc-core-([0-9_+.]+)_amd64.*/\1/')
          LZREL=$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/oneapi-src/level-zero/releases/tags/$L0")
          LZS=$(echo "$LZREL" | jq -r '.assets[].name' | grep -oE 'u[0-9]+\.[0-9]+' | sort -Vu)
          # Derive the L0 ubuntu suffix from the base ONEAPI image tag (NOT a
          # hardcoded u24). Prefer an exact match to the base distro; if that
          # build isn't shipped, fall back to the highest suffix present so we
          # never silently pick a different Ubuntu release.
          OBASE=$(grep '^ARG ONEAPI_VERSION=' .devops/intel.Dockerfile | head -1 | cut -d= -f2 | grep -oE 'ubuntu[0-9]+\.[0-9]+' | head -1 | sed -E 's/ubuntu/u/')
          [ -z "$OBASE" ] && OBASE="u24.04"
          LZU=$(echo "$LZS" | grep -F "$OBASE" | head -1)
          [ -z "$LZU" ] && LZU=$(echo "$LZS" | tail -1)
          [ -z "$LZU" ] && LZU="u24.04"
          echo "  base distro $OBASE -> level-zero ubuntu suffix $LZU"
          echo "latest_compute=$CR" >> $GITHUB_OUTPUT
          echo "latest_compute_full=$CRF" >> $GITHUB_OUTPUT
          echo "latest_igc=$IGC" >> $GITHUB_OUTPUT
          echo "latest_igc_full=$IGCF" >> $GITHUB_OUTPUT
          echo "latest_level_zero=${L0#v}" >> $GITHUB_OUTPUT
          echo "level_zero_ubuntu_version=$LZU" >> $GITHUB_OUTPUT
          echo "latest_igdgmm=$GMM" >> $GITHUB_OUTPUT
          echo "Derived from compute-runtime $CR: IGC=$IGC L0=${L0#v} gmmlib=$GMM"

      # ============================================================
      # Decision: 2a (point-to-stable / skip), up-to-date / skip-duplicate, or
      # 2b (advance the subtree, then build dev).
      #
      # `should_build` is the ONLY execution gate for building. `should_advance`
      # is a SECOND, independent gate: the committed subtree must catch up
      # whenever it is behind upstream, even when there is nothing to build
      # because that b+CR image already exists in GHCR.
      #
      # `strategy` is a diagnostic label explaining WHY, and must never appear
      # in a build-step condition - the build steps used to also require
      # `strategy == 'build-dev'`, so a `force: true` dispatch (which sets
      # `strategy=force`) skipped every build step and still reported a green
      # run.
      # ============================================================
      - name: Decide dev build strategy
        id: decide
        run: |
          set -e
          IS_RELEASE="${{ steps.upstream.outputs.is_release_tag }}"
          LATEST_B="${{ steps.upstream.outputs.latest_b }}"
          CURRENT_B=$(grep -m1 '^b_tag=' llama.cpp/.subtree-upstream | cut -d= -f2)
          FORCE="${{ github.event.inputs.force || 'false' }}"

          echo "current_b=$CURRENT_B" >> $GITHUB_OUTPUT

          if [[ "$FORCE" == "true" ]]; then
            if [[ "$LATEST_B" != "$CURRENT_B" ]]; then
              echo "should_advance=true" >> $GITHUB_OUTPUT
            else
              echo "should_advance=false" >> $GITHUB_OUTPUT
            fi
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "strategy=force" >> $GITHUB_OUTPUT
            echo "reason=Forced by manual dispatch (subtree $CURRENT_B -> upstream $LATEST_B)"
            exit 0
          fi

          if [[ "$IS_RELEASE" == "true" ]]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "should_advance=false" >> $GITHUB_OUTPUT
            echo "strategy=point-to-stable" >> $GITHUB_OUTPUT
            echo "reason=Upstream's newest tag is a release (${{ steps.upstream.outputs.latest_v }}), newer than $LATEST_B. Suggest pointing the dev image at the latest stable."
            exit 0
          fi

          # THE RULE: nothing newer upstream means nothing to do at all.
          if [[ "$LATEST_B" == "$CURRENT_B" ]]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "should_advance=false" >> $GITHUB_OUTPUT
            echo "strategy=up-to-date" >> $GITHUB_OUTPUT
            echo "reason=Subtree is already at the newest upstream b tag ($LATEST_B) - nothing to build."
            exit 0
          fi

          # The tree is behind, so an advance is due. Whether we ALSO build
          # depends only on whether this exact b+CR combination is already up.
          REPO="${{ github.repository }}/llama-sycl-b70"
          PREFIX="server-dev-${LATEST_B}-c${{ steps.deps.outputs.latest_compute }}-"
          TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:${REPO}:pull" | jq -r .token)
          TAGS=$(curl -s -H "Authorization: Bearer $TOKEN" "https://ghcr.io/v2/${REPO}/tags/list" | jq -r '.tags[]? // empty' || true)

          echo "should_advance=true" >> $GITHUB_OUTPUT
          if [ -n "$TOKEN" ] && echo "$TAGS" | grep -qF "$PREFIX"; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "strategy=skip-duplicate" >> $GITHUB_OUTPUT
            echo "reason=Image ${PREFIX%?} already exists in GHCR - advancing the subtree to $LATEST_B without rebuilding."
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "strategy=build-dev" >> $GITHUB_OUTPUT
            echo "reason=Newer b tag $LATEST_B available (subtree was $CURRENT_B). Syncing the subtree and building dev with compute-runtime-derived Intel pins."
          fi

      # ============================================================
      # Advance the vendored subtree to the resolved b tag.
      #
      # This calls the SAME script a human would run, so the CI path and the
      # manual path cannot drift. UPSTREAM_DIR points it at the clone the
      # resolve step already made, so upstream is fetched once per run instead
      # of twice.
      # ============================================================
      - name: Advance vendored subtree to the newest b tag
        id: advance
        if: steps.decide.outputs.should_advance == 'true'
        run: |
          set -e
          REF="${{ steps.upstream.outputs.latest_b }}"
          echo "Advancing vendored subtree ${{ steps.decide.outputs.current_b }} -> $REF"
          UPSTREAM_DIR="${{ steps.upstream.outputs.upstream_dir }}" \
            scripts/sync-llama-subtree.sh "$REF"
          echo
          echo "Staged change:"
          git diff --cached --stat | tail -5

      - name: Read llama.cpp version and b tag from the vendored subtree
        id: llama
        run: |
          set -e
          MAJ=$(grep -m1 '^set(LLAMA_VERSION_MAJOR' llama.cpp/CMakeLists.txt | sed 's/.*[[:space:]]\([0-9]*\).*/\1/')
          MIN=$(grep -m1 '^set(LLAMA_VERSION_MINOR' llama.cpp/CMakeLists.txt | sed 's/.*[[:space:]]\([0-9]*\).*/\1/')
          PAT=$(grep -m1 '^set(LLAMA_VERSION_PATCH' llama.cpp/CMakeLists.txt | sed 's/.*[[:space:]]\([0-9]*\).*/\1/')
          LATEST_V="v${MAJ}.${MIN}.${PAT}"
          LATEST_B=$(grep -m1 '^b_tag=' llama.cpp/.subtree-upstream | cut -d= -f2)
          [ -n "$LATEST_B" ] || { echo "::error::llama.cpp/.subtree-upstream has no b_tag="; exit 1; }
          echo "latest_v=$LATEST_V" >> $GITHUB_OUTPUT
          echo "latest_b=$LATEST_B" >> $GITHUB_OUTPUT
          echo "Vendored subtree now: CMakeLists $LATEST_V, b $LATEST_B"

      - name: Create guidance issue (2a - point dev to stable)
        if: steps.decide.outputs.strategy == 'point-to-stable'
        uses: actions/github-script@v7
        with:
          script: |
            const latest = '${{ steps.llama.outputs.latest_v }}';
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `B70 Dev: Latest llama.cpp is release tag (${latest}) — align dev image?`,
              body: `The latest tag is **${latest}** (a release). Point the dev image to the latest stable, or re-run with \`force: true\`.`,
              labels: ['dev','B70']
            });

      - name: Set up Docker Buildx
        if: steps.decide.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.decide.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No clone step: dev builds its own vendored llama.cpp/ subtree exactly as
      # committed. The b tag read above only names it in the image tag; the
      # content comes from this branch.

      - name: Compute dev temporary tag
        if: steps.decide.outputs.should_build == 'true'
        id: tag
        run: |
          TAG="server-dev-${{ steps.llama.outputs.latest_b }}-c${{ steps.deps.outputs.latest_compute }}-$(date +%Y%m%d-%H%M)"
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT
          echo "full_image=ghcr.io/${{ github.repository }}/llama-sycl-b70:${TAG}" >> $GITHUB_OUTPUT

      - name: Build and push (dev candidate)
        if: steps.decide.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devops/intel.Dockerfile
          target: server
          push: true
          tags: ghcr.io/${{ github.repository }}/llama-sycl-b70:${{ steps.tag.outputs.image_tag }}
          build-args: |
            COMPUTE_RUNTIME_VERSION=${{ steps.deps.outputs.latest_compute }}
            COMPUTE_RUNTIME_VERSION_FULL=${{ steps.deps.outputs.latest_compute_full }}
            IGC_VERSION=${{ steps.deps.outputs.latest_igc }}
            IGC_VERSION_FULL=${{ steps.deps.outputs.latest_igc_full }}
            LEVEL_ZERO_VERSION=${{ steps.deps.outputs.latest_level_zero }}
            LEVEL_ZERO_UBUNTU_VERSION=${{ steps.deps.outputs.level_zero_ubuntu_version }}
            IGDGMM_VERSION=${{ steps.deps.outputs.latest_igdgmm }}
            BUILD_WEBUI=0
            GGML_SYCL_F16=ON
            GGML_SYCL_DEVICE_ARCH=bmg-g31
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Report the versions that are ACTUALLY in the pushed image, not the ones CI
      # intended to install. These diverged silently once already: the image shipped
      # libze_loader.so.1.28.6 while the issue body claimed L0 1.32.0, because the
      # oneAPI install in the same stage displaced the pinned loader. Read the truth
      # back out of the built image and fail if it does not match the pin.
      # See docs/LEVEL-ZERO-VERSION-DISCREPANCY.md.
      - name: Verify built image versions
        id: verify
        if: steps.decide.outputs.should_build == 'true'
        run: |
          set -e
          IMAGE="ghcr.io/${{ github.repository }}/llama-sycl-b70:${{ steps.tag.outputs.image_tag }}"
          docker pull "$IMAGE" >/dev/null 2>&1 || true   # present locally from the build step already
          ACTUAL=$(docker run --rm --entrypoint /bin/bash "$IMAGE" -lc '
            dpkg-query -W -f="${Version}" libze1 2>/dev/null || echo unknown
            readlink -f /usr/lib/x86_64-linux-gnu/libze_loader.so.1 2>/dev/null | xargs -r basename
          ')
          L0_PKG=$(echo "$ACTUAL" | sed -n 1p)
          L0_LOADER=$(echo "$ACTUAL" | sed -n 2p)
          echo "libze1 package : $L0_PKG"
          echo "loader soname  : $L0_LOADER"
          echo "level_zero_actual=$L0_PKG" >> $GITHUB_OUTPUT
          echo "level_zero_loader=$L0_LOADER" >> $GITHUB_OUTPUT
          EXPECTED="${{ steps.deps.outputs.latest_level_zero }}"
          case "$L0_LOADER" in
            *".so.${EXPECTED}") echo "OK: loader matches the pinned Level Zero ${EXPECTED}" ;;
            *) echo "ERROR: pinned Level Zero ${EXPECTED} is NOT in the image (found: ${L0_LOADER})" >&2; exit 1 ;;
          esac

      - name: Create detailed Issue (dev build)
        if: steps.decide.outputs.should_build == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.tag.outputs.image_tag }}';
            const full = '${{ steps.tag.outputs.full_image }}';
            let body = `**Dev weekly build**\n\n`;
            body += `**Image**: \`${full}\`\n`;
            body += `**llama.cpp b tag**: ${{ steps.llama.outputs.latest_b }}\n`;
            body += `**Subtree**: advanced from \`${{ steps.decide.outputs.current_b }}\` to \`${{ steps.llama.outputs.latest_b }}\` by this run\n`;
            body += `**Compute Runtime**: ${{ steps.deps.outputs.latest_compute }} (paired IGC ${{ steps.deps.outputs.latest_igc }}, L0 ${{ steps.deps.outputs.latest_level_zero }})\n`;
            body += `**Image actually contains**: libze1 \`${{ steps.verify.outputs.level_zero_actual }}\`, loader \`${{ steps.verify.outputs.level_zero_loader }}\`\n`;
            body += `**Build**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n`;
            body += `**Reason**: ${{ steps.decide.outputs.reason }}\n\n`;
            body += `Development snapshot. Use at your own risk.\n`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `B70 Dev Image Ready: ${tag}`, body, labels: ['dev','B70']
            });

      # ============================================================
      # Record the advance on dev.
      #
      # This runs LAST on purpose. The subtree was already replaced in the
      # workspace to build the image, but it is committed only after the build
      # (and the version check) succeeded, so a failed build leaves the
      # repository at the previous b tag and the next run retries instead of
      # silently skipping as "up-to-date". It also runs when the image already
      # existed (skip-duplicate), where it is the ONLY effect of the run.
      #
      # If this push fails, nothing is lost: the image is already published and
      # the next scheduled run sees the same gap and advances again.
      # ============================================================
      - name: Record the advance on the dev branch
        if: steps.decide.outputs.should_advance == 'true'
        run: |
          set -e
          REF="${{ steps.llama.outputs.latest_b }}"
          git add -A llama.cpp
          if git diff --cached --quiet; then
            echo "Nothing staged; dev already records $REF"
            exit 0
          fi
          git commit \
            -m "build(dev): auto-advance vendored subtree to $REF" \
            -m "Resolved as the newest upstream llama.cpp b* tag by the scheduled dev build and synced with scripts/sync-llama-subtree.sh. The image built from this tree is server-dev-${{ steps.llama.outputs.latest_b }}-c${{ steps.deps.outputs.latest_compute }}."
          git push origin HEAD:dev && echo "Recorded $REF on dev" || {
            echo "::warning::could not push the advanced subtree; dev still records ${{ steps.decide.outputs.current_b }}. The next scheduled run will retry."
          }