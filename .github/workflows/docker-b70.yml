name: Build B70 SYCL Docker (community)

on:
  push:
    branches: [ main, master ]
    paths:
      - '.devops/intel.Dockerfile'
      - 'scripts/**'
      - '.github/workflows/docker-b70.yml'
  workflow_dispatch:
    inputs:
      oneapi_version:
        description: 'intel/deep-learning-essentials devel tag'
        required: false
        default: '2026.1-devel-ubuntu24.04'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (optional for publishing)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (server target)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devops/intel.Dockerfile
          target: server
          push: false   # set true + tags when you have a registry
          tags: |
            ghcr.io/${{ github.repository }}/llama-sycl-b70:server
          build-args: |
            ONEAPI_VERSION=${{ github.event.inputs.oneapi_version || '2026.1-devel-ubuntu24.04' }}
            GGML_SYCL_F16=ON
            GGML_SYCL_DEVICE_ARCH=bmg-g31
          cache-from: type=gha
          cache-to: type=gha,mode=max
